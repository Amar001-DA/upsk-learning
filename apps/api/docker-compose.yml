version: "3.9"

services:
  api:
    image: node:20
    working_dir: /app
    volumes:
      - .:/app
    command: npm run dev
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: upsk
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
